services:
  - type: web
    name: vacation-routine-app
    runtime: node
    plan: free
    buildCommand: "npm install"
    startCommand: "node scripts/migrate-turso.js && node server.js"
    envVars:
      # Required server-only credentials. Set their values in Render; never commit them.
      - key: FAMILY_PIN_HYEON1
        sync: false
      - key: FAMILY_PIN_HYEON2
        sync: false
      - key: FAMILY_PIN_HYEON3
        sync: false
      - key: FAMILY_PIN_PARENT
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: APP_BASE_URL
        value: https://vacation-routine-app.onrender.com
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_IDS
        sync: false
      - key: TELEGRAM_MOM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_MOM_CHAT_IDS
        sync: false
