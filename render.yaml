services:
  - type: web
    name: vacation-routine-app
    runtime: node
    plan: free
    buildCommand: "npm install"
    startCommand: "node server.js"
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: APP_BASE_URL
        value: https://vacation-routine-app.onrender.com
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_IDS
        sync: false
      - key: TELEGRAM_MOM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_MOM_CHAT_IDS
        sync: false
